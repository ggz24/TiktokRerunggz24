<!doctype html><html lang="th"><head><meta charset="utf-8"><title>Live Hub Chat</title><link rel="stylesheet" href="options.css"></head><body>
<h1>เชื่อม AI กับแชท TikTok</h1><p>ใช้กับ Live Hub ที่ localhost:3100 บนเครื่องนี้ เปิด TikTok Shop ในโปรไฟล์ของบัญชีที่จับคู่ไว้</p>
<label for="pairing">ข้อมูลจับคู่จาก Live Hub</label><textarea id="pairing" rows="6" placeholder="วางข้อมูลจากปุ่มสร้างรหัสเชื่อมแชท" autocomplete="off"></textarea>
<button id="save">เชื่อมบัญชีนี้</button><button id="clear">หยุดเชื่อมต่อ</button><p id="status" role="status"></p>
<p>หลังเชื่อม ให้รีเฟรช TikTok Shop หนึ่งครั้งเพื่อเริ่มรับคอมเมนต์ รหัสเก็บในหน่วยความจำของ Chrome และหายเมื่อปิดเบราว์เซอร์ ไม่ส่ง Cookie หรือ API key ออกจาก Chrome</p>
<script src="options.js"></script></body></html>
