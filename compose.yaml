services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: livehub
      POSTGRES_PASSWORD: livehub_dev
      POSTGRES_DB: livehub
    ports: ['127.0.0.1:5433:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U livehub -d livehub']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build: { context: ., target: worker }
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  api:
    build: { context: ., target: api }
    environment:
      API_PORT: 4000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://livehub:livehub_dev@postgres:5432/livehub
      REDIS_URL: redis://redis:6379
      ACCOUNT_ENCRYPTION_KEY: ${ACCOUNT_ENCRYPTION_KEY:?Run npm run setup:local first}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Run npm run setup:local first}
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build: { context: ., target: web }
    environment:
      APP_USERNAME: ${APP_USERNAME:-demo}
      APP_PASSWORD: ${APP_PASSWORD:?Run npm run setup:local first}
      SESSION_SECRET: ${SESSION_SECRET:?Run npm run setup:local first}
      API_INTERNAL_URL: http://api:4000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Run npm run setup:local first}
    ports: ['127.0.0.1:3100:3100']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
